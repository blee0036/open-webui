# New deployments only. Do not attach an existing vector database to this file.
# Images are prebuilt for linux/amd64 and linux/arm64 by .github/workflows/team-images.yaml.
# Update: docker compose -f docker-compose.team.yaml pull && docker compose -f docker-compose.team.yaml up -d
# Build locally instead: add -f docker-compose.team.build.yaml (see that file).
# Pin a release with TEAM_IMAGE_TAG (latest, sha-<commit>, or a vX.Y.Z tag); all three images share it.
name: ${TEAM_DEPLOYMENT_NAME:-open-webui-team}

x-team-images:
  webui: &webui-image ${TEAM_IMAGE_REGISTRY:-ghcr.io/blee0036}/open-webui-team:${TEAM_IMAGE_TAG:-latest}
  controller: &controller-image ${TEAM_IMAGE_REGISTRY:-ghcr.io/blee0036}/open-webui-sandbox-controller:${TEAM_IMAGE_TAG:-latest}
  runtime: &runtime-image ${TEAM_IMAGE_REGISTRY:-ghcr.io/blee0036}/open-webui-sandbox-runtime:${TEAM_IMAGE_TAG:-latest}
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: webui
      POSTGRES_USER: webui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local env file}
    volumes:
      - team-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U webui -d webui']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [control]
    restart: unless-stopped

  open-webui:
    image: *webui-image
    environment:
      WEBUI_URL: ${WEBUI_URL:?Set the externally reachable HTTPS URL}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL}
      WEBUI_SESSION_COOKIE_SECURE: 'true'
      WEBUI_AUTH_COOKIE_SECURE: 'true'
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set a stable secret and back it up}
      DATABASE_URL: postgresql://webui:${POSTGRES_PASSWORD}@postgres:5432/webui
      VECTOR_DB: pgvector
      PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: '1024'
      RAG_EMBEDDING_ENGINE: ''
      RAG_EMBEDDING_MODEL: BAAI/bge-m3
      # bge-m3 is baked into the image. Auto-update would re-check HuggingFace on every
      # start and pull the whole repo (ONNX export, ColBERT weights, images: several GB).
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: 'false'
      TEAM_WORKSPACE_MODE: 'true'
      ENABLE_OLLAMA_API: 'false'
      ENABLE_DIRECT_CONNECTIONS: 'false'
      SANDBOX_CONTROLLER_URL: http://sandbox:8080
      SANDBOX_CONTROLLER_KEY: ${SANDBOX_CONTROLLER_KEY:?Set a controller-only secret}
      # Upper bound for one tool call (unset = wait forever). Must exceed the sandbox's
      # agent wait + start + SANDBOX_EXECUTION_SECONDS so the sandbox reports its own error first.
      AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER: ${AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER:-2100}
      # Extra tries when a model upstream errors, drops, or replies empty before any output (0 = off).
      MODEL_REQUEST_RETRIES: ${MODEL_REQUEST_RETRIES:-3}
      ENABLE_REASONING_PRESETS: ${ENABLE_REASONING_PRESETS:-true}
      ENABLE_WEB_SEARCH: 'true'
      # DuckDuckGo first (bundled ddgs, no key); when it errors, is rate-limited or finds
      # nothing, the same query goes to the bundled SearXNG.
      WEB_SEARCH_ENGINE: duckduckgo
      WEB_SEARCH_FALLBACK_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>&format=json
      PERSONAL_MCP_ALLOWED_PRIVATE_ORIGINS: ${PERSONAL_MCP_ALLOWED_PRIVATE_ORIGINS:-}
    volumes:
      - team-data:/app/backend/data
    ports:
      - '127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080'
    networks: [control, public]
    depends_on:
      postgres: {condition: service_healthy}
      sandbox: {condition: service_started}
      searxng: {condition: service_started}
    restart: unless-stopped

  sandbox:
    image: *controller-image
    container_name: ${SANDBOX_NAMESPACE:-owui}-sandbox
    environment:
      # The controller creates runtimes and firewall helpers itself; it must use the same images.
      SANDBOX_RUNTIME_IMAGE: *runtime-image
      SANDBOX_CONTROLLER_IMAGE: *controller-image
      SANDBOX_CONTROLLER_KEY: ${SANDBOX_CONTROLLER_KEY}
      SANDBOX_CONTROLLER_CONTAINER: ${SANDBOX_NAMESPACE:-owui}-sandbox
      SANDBOX_PROXY_CONTAINER: ${SANDBOX_NAMESPACE:-owui}-egress
      SANDBOX_NAMESPACE: ${SANDBOX_NAMESPACE:-owui}
      # 8C32G sizing: each sandbox is capped at 1 CPU / 2 GiB. Allow ~2 GiB free RAM per slot.
      SANDBOX_MAX_RUNNING: ${SANDBOX_MAX_RUNNING:-10}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-2g}
      # Extra swap per sandbox, taken from the host's swap (see DEPLOY_GUIDE: 沙盒资源). 0 = none.
      SANDBOX_SWAP: ${SANDBOX_SWAP:-0}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-600}
      SANDBOX_ENABLE_BROWSER: ${SANDBOX_ENABLE_BROWSER:-false}
      # Longest single Agent command (30 minutes).
      SANDBOX_EXECUTION_SECONDS: ${SANDBOX_EXECUTION_SECONDS:-1800}
      # An Agent command waits at most this long for a free slot or the workspace's previous command.
      SANDBOX_AGENT_WAIT_SECONDS: ${SANDBOX_AGENT_WAIT_SECONDS:-60}
      # How often home-volume sizes are measured for the per-package sandbox storage limit (soft).
      SANDBOX_DISK_SCAN_SECONDS: ${SANDBOX_DISK_SCAN_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - team-sandbox-state:/state
    networks: [control]
    restart: unless-stopped

  egress:
    image: *controller-image
    container_name: ${SANDBOX_NAMESPACE:-owui}-egress
    command: [python, /app/public_proxy.py]
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # Include every public hostname and address that reaches the platform/control plane.
      SANDBOX_EGRESS_DENY_HOSTS: ${SANDBOX_EGRESS_DENY_HOSTS:?List the platform hostnames}
      SANDBOX_EGRESS_DENY_CIDRS: ${SANDBOX_EGRESS_DENY_CIDRS:-}
    networks: [public]
    restart: unless-stopped

  runtime-image:
    image: *runtime-image
    # Pull-only: lets `docker compose pull` fetch/refresh the runtime image. It exits
    # immediately; real runtimes are only ever started by the lifecycle controller.
    entrypoint: [/bin/true]
    network_mode: none
    restart: 'no'

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set a search-service secret}
    volumes:
      - ./deploy/team/searxng.yml:/etc/searxng/settings.yml:ro
    networks: [control, public]
    restart: unless-stopped

networks:
  control: {internal: true}
  public: {}
volumes:
  team-postgres: {}
  team-data: {}
  team-sandbox-state: {}
